name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'official-site/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'official-site/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('official-site/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: official-site

      - name: Build Next.js site
        run: pnpm build
        working-directory: official-site

      # develop ブランチ または develop に対する PR の場合は preview チャンネルにデプロイ
      - name: Deploy to Cloudflare Pages (Preview)
        if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy official-site/out --project-name=milu-official-site --branch=develop
          working-directory: official-site

      # main ブランチ または main に対する PR の場合は production（本番）環境にデプロイ
      - name: Deploy to Cloudflare Pages (Production)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy official-site/out --project-name=milu-official-site --branch=main
          working-directory: official-site
