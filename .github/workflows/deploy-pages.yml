name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - develop
    paths:
      - 'official-site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ先環境 (preview: プレビュー環境, production: 本番環境)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('official-site/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: official-site

      - name: Build Next.js site
        run: pnpm build
        working-directory: official-site

      # developブランチへの自動プッシュ時、または手動起動でpreviewを選択した場合にプレビューデプロイ
      - name: Deploy to Cloudflare Pages (Preview)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=milu-official-site --branch=${{ github.ref_name }}
          workingDirectory: official-site

      # 手動起動でproductionを選択した場合に本番環境へデプロイ
      - name: Deploy to Cloudflare Pages (Production)
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=milu-official-site --branch=main
          workingDirectory: official-site
